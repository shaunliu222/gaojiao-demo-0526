# 构建并发布到 GitHub Pages（仓库 Settings → Pages → Build: GitHub Actions）
# 访问地址：https://<用户名>.github.io/smart-teaching/
#
# 【河南科技大学】仅此分支触发；与主版本 main 解耦。合并到 main 前须为明确需求。
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - "河南科技大学"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: 产品名称：教学科研实训一体化平台/制作交互页面/package-lock.json

      - name: Install and build
        working-directory: 产品名称：教学科研实训一体化平台/制作交互页面
        env:
          VITE_BASE_PATH: /smart-teaching/
        run: npm ci && npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: 产品名称：教学科研实训一体化平台/制作交互页面/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
