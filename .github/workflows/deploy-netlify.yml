# 构建并发布到 Netlify（仓库侧全自动；你只需在 GitHub 填一次密钥）
#
# GitHub：Settings → Secrets and variables → Actions → New repository secret
#   NETLIFY_AUTH_TOKEN — Netlify → User settings → Applications → Personal access tokens
#   NETLIFY_SITE_ID     — 站点 → Site configuration → General → Site details → Site ID
#
# 若 Netlify 已连接同一仓库自动构建，会部署两次；可只在 Netlify 里 Disconnect Git，仅保留本工作流。
name: Deploy to Netlify

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: 产品名称：教学科研实训一体化平台/制作交互页面/package-lock.json

      - name: Install and build
        working-directory: 产品名称：教学科研实训一体化平台/制作交互页面
        run: npm ci && npm run build

      - name: Deploy to Netlify
        working-directory: 产品名称：教学科研实训一体化平台/制作交互页面
        run: npx --yes netlify-cli deploy --prod --dir=dist
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
